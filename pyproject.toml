[project]
name = "dsa-python"
version = "0.1.0"
description = "Data structures and algorithms in Python (CLRS, LeetCode and others)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "GuilhermeDellatin", email = "54901574+GuilhermeDellatin@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # permite `import exercises...` nos testes
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "N",       # pep8-naming
]

[tool.ruff.lint.isort]
known-first-party = ["dsa_python", "exercises"]
